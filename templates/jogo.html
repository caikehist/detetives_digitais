<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <title>{{ jogo.titulo }} - Detetives Digitais</title>
    <!-- Tailwind CSS rodando 100% offline a partir de arquivo local -->
    <script src="/static/tailwind.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

    <!-- Cabeçalho -->
    <header class="bg-indigo-600 text-white shadow-lg">
        <div class="max-w-6xl mx-auto px-6 py-8 text-center">
            <span class="bg-indigo-500 text-indigo-100 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Ensino Fundamental - Anos Iniciais</span>
            <h1 class="text-3xl md:text-4xl font-bold mt-3">Mostra de Ciências, Robótica e Tecnologias</h1>
            <p class="text-indigo-200 mt-2 text-lg">Estande: <span class="font-semibold text-white">Detetives Digitais</span> 🕵️‍♂️💻</p>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-4xl mx-auto px-6 py-12">

        <a href="/jogos" class="inline-flex items-center gap-1 text-sm font-semibold text-indigo-600 hover:text-indigo-800 transition-colors mb-8">← Voltar para os jogos</a>

        <section class="bg-indigo-50 rounded-2xl p-8 border border-indigo-100 mb-8 text-center">
            <span class="text-5xl">{{ jogo.emoji }}</span>
            <h2 class="text-3xl font-bold text-slate-900 mt-4">{{ jogo.titulo }}</h2>
            <p class="text-slate-600 leading-relaxed mt-2 max-w-2xl mx-auto text-sm">{{ jogo.descricao }}</p>
        </section>

        <!-- Jogo (player TurboWarp, funciona sem internet) -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
            <iframe src="/static/{{ jogo.arquivo }}" title="{{ jogo.titulo }}"
                    class="w-full aspect-[4/3] rounded-xl border-0" allowfullscreen></iframe>
        </section>

    </main>

    <!-- Rodapé -->
    <footer class="bg-slate-900 text-slate-400 py-8 text-center text-sm border-t border-slate-800">
        <p>Mostra de Ciências & Robótica — FastAPI (Modo 100% Offline)</p>
    </footer>

</body>
</html>
